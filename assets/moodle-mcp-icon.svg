<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="50%" stop-color="#1e1b4b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>

    <!-- Moodle Orange Gradient -->
    <linearGradient id="moodleGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ff9933"/>
      <stop offset="50%" stop-color="#f98012"/>
      <stop offset="100%" stop-color="#ea580c"/>
    </linearGradient>

    <!-- MCP Electric Violet Gradient -->
    <linearGradient id="mcpGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#8b5cf6"/>
      <stop offset="50%" stop-color="#6366f1"/>
      <stop offset="100%" stop-color="#38bdf8"/>
    </linearGradient>

    <!-- Cap Gradient -->
    <linearGradient id="capGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#475569"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>

    <!-- Glow Filter -->
    <filter id="mcpGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>

    <!-- Drop Shadow for Moodle Logo -->
    <filter id="dropShadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.6"/>
    </filter>

    <!-- Subtle Outer Border Gradient -->
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366f1" stop-opacity="0.6"/>
      <stop offset="50%" stop-color="#334155" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#f98012" stop-opacity="0.6"/>
    </linearGradient>
  </defs>

  <!-- Squircle Base Container -->
  <rect x="16" y="16" width="480" height="480" rx="108" fill="url(#bgGrad)" stroke="url(#borderGrad)" stroke-width="3"/>

  <!-- Background Decorative Tech Grid & Protocol Constellation -->
  <g opacity="0.15">
    <circle cx="256" cy="256" r="180" fill="none" stroke="#6366f1" stroke-dasharray="4 8" stroke-width="1.5"/>
    <circle cx="256" cy="256" r="220" fill="none" stroke="#38bdf8" stroke-dasharray="2 10" stroke-width="1"/>
    <!-- Diagonal Connection Rays -->
    <line x1="80" y1="80" x2="180" y2="180" stroke="#8b5cf6" stroke-width="1.5" stroke-dasharray="3 6"/>
    <line x1="432" y1="80" x2="332" y2="180" stroke="#f98012" stroke-width="1.5" stroke-dasharray="3 6"/>
  </g>

  <!-- AI / Context Sparkles (Top Right) -->
  <g transform="translate(385, 75)" opacity="0.85" filter="url(#mcpGlow)">
    <path d="M0 -14 C0 -4 4 0 14 0 C4 0 0 4 0 14 C0 4 -4 0 -14 0 C-4 0 0 -4 0 -14 Z" fill="#38bdf8"/>
    <circle cx="0" cy="0" r="3" fill="#ffffff"/>
  </g>
  <g transform="translate(425, 120) scale(0.6)" opacity="0.65">
    <path d="M0 -14 C0 -4 4 0 14 0 C4 0 0 4 0 14 C0 4 -4 0 -14 0 C-4 0 0 -4 0 -14 Z" fill="#8b5cf6"/>
  </g>

  <!-- Main Moodle 'm' + Mortarboard Mark (Centered & Scaled) -->
  <!-- Scaled from original viewBox bounds (0..315, 74..310) -> target (scale: 1.05, tx: 90, ty: 48) -->
  <g transform="translate(88, 48) scale(1.06)" filter="url(#dropShadow)">
    
    <!-- Moodle 'm' Path in Rich Brand Gradient -->
    <path fill="url(#moodleGrad)" d="M289.6,309.8V201.5c0-22.6-9.4-34-28-34c-18.7,0-28.1,11.3-28.1,34v108.3h-55.1V201.5c0-22.6-9.2-34-27.6-34c-18.7,0-28,11.3-28,34v108.3H67.7V195.1c0-23.6,8.2-41.5,24.6-53.6c14.4-10.8,34-16.3,58.6-16.3c24.9,0,43.3,6.4,55.1,19.2c10.2-12.8,28.7-19.2,55.6-19.2c24.6,0,44.1,5.4,58.5,16.3c16.4,12.1,24.6,30,24.6,53.6v114.7H289.6z"/>
    
    <!-- Official Graduation Cap (Mortarboard) -->
    <path fill="url(#capGrad)" stroke="#64748b" stroke-width="1.2" d="M174.7,116.9l54.7-40l-0.7-2.4C130,86.6,85.1,95.2,0,144.5l0.8,2.2l6.8,0.1c-0.6,6.8-1.7,23.6-0.3,49c-9.4,27.3-0.2,45.9,8.4,66.1c1.4-21,1.2-44-5.2-66.9c-1.3-25.1-0.2-41.7,0.4-48.1l56.4,0.5c0,0-0.4,17,1.7,33.1c50.4,17.7,101.1-0.1,128-43.7C189.4,128.3,174.7,116.9,174.7,116.9z"/>
    
    <!-- Cap Diamond Center Pin & Tassel Button Accent -->
    <circle cx="174" cy="116" r="3.5" fill="#f98012"/>
  </g>

  <!-- Protocol Bus Connection Layer (Underneath the 3 stems of 'm') -->
  <!-- Legs of 'm' land around y=376 in the canvas. We connect them into protocol pins! -->
  <g transform="translate(0, 10)">
    <!-- Circuit lines extending from the 3 legs -->
    <!-- Leg 1 (Left): x ~ 160 -->
    <!-- Leg 2 (Center): x ~ 256 -->
    <!-- Leg 3 (Right): x ~ 352 -->
    
    <!-- Circuit Track Base -->
    <path d="M 160 388 L 160 412 L 210 412" stroke="#6366f1" stroke-width="3" stroke-linecap="round" fill="none" opacity="0.8"/>
    <path d="M 352 388 L 352 412 L 302 412" stroke="#38bdf8" stroke-width="3" stroke-linecap="round" fill="none" opacity="0.8"/>
    <path d="M 256 388 L 256 405" stroke="#8b5cf6" stroke-width="3" stroke-linecap="round" fill="none" opacity="0.8"/>
    
    <!-- Pin Node Dots -->
    <circle cx="160" cy="386" r="5" fill="#f98012" stroke="#ffffff" stroke-width="1.5"/>
    <circle cx="256" cy="386" r="5" fill="#8b5cf6" stroke="#ffffff" stroke-width="1.5"/>
    <circle cx="352" cy="386" r="5" fill="#38bdf8" stroke="#ffffff" stroke-width="1.5"/>

    <!-- Central MCP Pill Badge -->
    <g transform="translate(196, 420)">
      <!-- Pill Container with Glow -->
      <rect x="0" y="0" width="120" height="36" rx="18" fill="#0f172a" stroke="url(#mcpGrad)" stroke-width="2.5" filter="url(#mcpGlow)"/>
      <rect x="0" y="0" width="120" height="36" rx="18" fill="#1e1b4b" stroke="url(#mcpGrad)" stroke-width="2"/>
      
      <!-- MCP Connection Nodes inside pill -->
      <circle cx="20" cy="18" r="4" fill="#38bdf8"/>
      <circle cx="100" cy="18" r="4" fill="#f98012"/>
      
      <!-- MCP Text -->
      <text x="60" y="24" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Fira Code', monospace" font-size="16" font-weight="900" fill="#ffffff" letter-spacing="2" text-anchor="middle">MCP</text>
    </g>
  </g>
</svg>