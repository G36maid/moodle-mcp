<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 640" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#080C15"/>
      <stop offset="50%" stop-color="#0F172A"/>
      <stop offset="100%" stop-color="#05070C"/>
    </linearGradient>

    <!-- Outer Border Gradient -->
    <linearGradient id="cardBorder" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#F97316" stop-opacity="0.8"/>
      <stop offset="25%" stop-color="#8B5CF6" stop-opacity="0.5"/>
      <stop offset="70%" stop-color="#38BDF8" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#6366F1" stop-opacity="0.3"/>
    </linearGradient>

    <!-- Moodle Orange Text Gradient -->
    <linearGradient id="moodleTextGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFAD5A"/>
      <stop offset="55%" stop-color="#F98012"/>
      <stop offset="100%" stop-color="#E05607"/>
    </linearGradient>

    <!-- Drop Shadows -->
    <filter id="mDropShadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="10" stdDeviation="16" flood-color="#EA580C" flood-opacity="0.45"/>
      <feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#000000" flood-opacity="0.7"/>
    </filter>

    <!-- Connection Bus Gradient (indigo → violet → pink, echoing the three pads) -->
    <linearGradient id="busGrad" gradientUnits="userSpaceOnUse" x1="44" y1="234" x2="272" y2="234">
      <stop offset="0%" stop-color="#A78BFA"/>
      <stop offset="50%" stop-color="#818CF8"/>
      <stop offset="100%" stop-color="#6EE7B7"/>
    </linearGradient>

    <!-- Wordmark gradient (userSpace: continuous across all separated letter paths) -->
    <linearGradient id="wordGrad" gradientUnits="userSpaceOnUse" x1="0" y1="0" x2="0" y2="315.2">
      <stop offset="0%" stop-color="#FFAD5A"/>
      <stop offset="55%" stop-color="#F98012"/>
      <stop offset="100%" stop-color="#E05607"/>
    </linearGradient>

    <!-- MCP Text Gradient -->
    <linearGradient id="mcpTextGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#A78BFA"/>
      <stop offset="50%" stop-color="#C084FC"/>
      <stop offset="100%" stop-color="#38BDF8"/>
    </linearGradient>

    <!-- Grid Pattern -->
    <pattern id="techGrid" width="32" height="32" patternUnits="userSpaceOnUse">
      <circle cx="16" cy="16" r="0.8" fill="#475569" opacity="0.4"/>
      <line x1="0" y1="16" x2="32" y2="16" stroke="#334155" stroke-width="0.4" opacity="0.2"/>
      <line x1="16" y1="0" x2="16" y2="32" stroke="#334155" stroke-width="0.4" opacity="0.2"/>
    </pattern>
  </defs>

  <!-- Banner Container -->
  <rect x="6" y="6" width="1268" height="628" rx="28" fill="url(#bgGrad)"/>

  <!-- Tech Grid Background -->
  <rect x="6" y="6" width="1268" height="628" rx="28" fill="url(#techGrid)"/>

  <!-- Border Frame with Dynamic Neon Shimmer -->
  <rect x="6" y="6" width="1268" height="628" rx="28" fill="none" stroke="url(#cardBorder)" stroke-width="2.5"/>

  <!-- Top Accent Beam -->
  <line x1="130" y1="6" x2="430" y2="6" stroke="#F97316" stroke-width="3.5" stroke-linecap="round"/>
  <line x1="730" y1="6" x2="1030" y2="6" stroke="#38BDF8" stroke-width="3" stroke-linecap="round"/>

  <!-- LEFT: Centered Moodle Mark -->
  <g transform="translate(8.5, 75.1) scale(1.55)">
    <g transform="translate(20.28, -11.98)">
    <!-- Transformed Official Moodle Mark (centered) -->
    <g transform="translate(15.7, 7.9) scale(0.69)" filter="url(#mDropShadow)">
      <!-- Official 'm' -->
      <path fill="url(#moodleTextGrad)" d="M289.6,309.8V201.5c0-22.6-9.4-34-28-34c-18.7,0-28.1,11.3-28.1,34v108.3h-55.1V201.5
