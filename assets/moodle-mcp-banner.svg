        c24.9,0,43.3,6.4,55.1,19.2c10.2-12.8,28.7-19.2,55.6-19.2c24.6,0,44.1,5.4,58.5,16.3c16.4,12.1,24.6,30,24.6,53.6v114.7H289.6z"/>

      <!-- Official Graduation Cap -->
      <path fill="#1E293B" stroke="#64748B" stroke-width="2.5" d="M174.7,116.9l54.7-40l-0.7-2.4C130,86.6,85.1,95.2,0,144.5l0.8,2.2l6.8,0.1
        c-0.6,6.8-1.7,23.6-0.3,49c-9.4,27.3-0.2,45.9,8.4,66.1c1.4-21,1.2-44-5.2-66.9c-1.3-25.1-0.2-41.7,0.4-48.1l56.4,0.5
        c0,0-0.4,17,1.7,33.1c50.4,17.7,101.1-0.1,128-43.7C189.4,128.3,174.7,116.9,174.7,116.9z"/>
    </g>

    <!-- 3 MCP Protocol Connector Pads overlaying the three 'm' feet (9.5px margin left/right/bottom, 19px rounded square = half the leg stroke width) -->
    <g transform="translate(81.4, 212.2)">
      <rect x="-9.5" y="-19" width="19" height="19" rx="5" fill="#8B5CF6"/>
    </g>
    <g transform="translate(157.8, 212.2)">
      <rect x="-9.5" y="-19" width="19" height="19" rx="5" fill="#6366F1"/>
    </g>
    <g transform="translate(234.5, 212.2)">
      <rect x="-9.5" y="-19" width="19" height="19" rx="5" fill="#34D399"/>
    </g>

    <!-- Metro Network: trunk lines from the three feet → circle line → 8 radiating branches -->
    <!-- Circle line -->
    <path d="M 44 234 H 272" stroke="url(#busGrad)" stroke-width="2.5" stroke-linecap="round" fill="none"/>
    <!-- Trunk drops (pad colour per leg) -->
    <g fill="none" stroke-width="2" stroke-linecap="round">
      <path d="M 81.4 212.2 V 234" stroke="#A78BFA"/>
      <path d="M 157.8 212.2 V 234" stroke="#818CF8"/>
      <path d="M 234.5 212.2 V 234" stroke="#6EE7B7"/>
      <!-- Branches A (left interchange) -->
      <path d="M 81.4 234 H 58 A 6 6 0 0 0 52 240 V 258" stroke="#38BDF8"/>
      <path d="M 81.4 234 V 244 A 6 6 0 0 1 75.4 250 H 40 A 6 6 0 0 0 34 256 V 272" stroke="#34D399"/>
      <path d="M 81.4 234 V 246 A 6 6 0 0 0 87.4 252 H 118 A 6 6 0 0 1 124 258 V 272" stroke="#A78BFA"/>
      <!-- Branches B (middle interchange) -->
      <path d="M 157.8 234 V 256" stroke="#A78BFA"/>
      <path d="M 157.8 234 V 244 A 6 6 0 0 0 163.8 250 H 186 A 6 6 0 0 1 192 256 V 268" stroke="#F472B6"/>
      <!-- Branches C (right interchange) -->
      <path d="M 234.5 234 H 258 A 6 6 0 0 1 264 240 V 258" stroke="#F472B6"/>
      <path d="M 234.5 234 H 278 A 6 6 0 0 1 284 240 V 266" stroke="#38BDF8"/>
      <path d="M 234.5 234 V 252" stroke="#34D399"/>
    </g>
    <!-- Terminal ports -->
    <g>
      <rect x="47" y="257" width="10" height="10" rx="3" fill="#080C15" stroke="#38BDF8" stroke-width="1.5"/><circle cx="52" cy="262" r="1.8" fill="#38BDF8"/>
      <rect x="29" y="271" width="10" height="10" rx="3" fill="#080C15" stroke="#34D399" stroke-width="1.5"/><circle cx="34" cy="276" r="1.8" fill="#34D399"/>
      <rect x="119" y="271" width="10" height="10" rx="3" fill="#080C15" stroke="#A78BFA" stroke-width="1.5"/><circle cx="124" cy="276" r="1.8" fill="#A78BFA"/>
      <rect x="152.8" y="256" width="10" height="10" rx="3" fill="#080C15" stroke="#A78BFA" stroke-width="1.5"/><circle cx="157.8" cy="261" r="1.8" fill="#A78BFA"/>
      <rect x="187" y="267" width="10" height="10" rx="3" fill="#080C15" stroke="#F472B6" stroke-width="1.5"/><circle cx="192" cy="272" r="1.8" fill="#F472B6"/>
      <rect x="259" y="257" width="10" height="10" rx="3" fill="#080C15" stroke="#F472B6" stroke-width="1.5"/><circle cx="264" cy="262" r="1.8" fill="#F472B6"/>
      <rect x="279" y="265" width="10" height="10" rx="3" fill="#080C15" stroke="#38BDF8" stroke-width="1.5"/><circle cx="284" cy="270" r="1.8" fill="#38BDF8"/>
      <rect x="229.5" y="252" width="10" height="10" rx="3" fill="#080C15" stroke="#34D399" stroke-width="1.5"/><circle cx="234.5" cy="257" r="1.8" fill="#34D399"/>
    </g>
    <!-- Interchange stations (double-ring) -->
    <g>
      <circle cx="81.4" cy="234" r="5.5" fill="#080C15" stroke="#A78BFA" stroke-width="2"/><circle cx="81.4" cy="234" r="2" fill="#E2E8F0"/>
      <circle cx="157.8" cy="234" r="5.5" fill="#080C15" stroke="#818CF8" stroke-width="2"/><circle cx="157.8" cy="234" r="2" fill="#E2E8F0"/>
      <circle cx="234.5" cy="234" r="5.5" fill="#080C15" stroke="#6EE7B7" stroke-width="2"/><circle cx="234.5" cy="234" r="2" fill="#E2E8F0"/>
    </g>
    </g>

  </g>

  <!-- RIGHT: Typography -->
  <g>
    <!-- Main Title: moodle-mcp -->
