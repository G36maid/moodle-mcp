    <!-- Subtitle / Mission Statement -->
    <g transform="translate(537.8, 400.4) scale(1.02)">
      <text font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Inter', Roboto, sans-serif" font-size="22" font-weight="500" fill="#E2E8F0" letter-spacing="-0.2">
