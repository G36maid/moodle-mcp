name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

env:
  BIN_NAME: moodle-mcp

jobs:
  build:
    name: build (${{ matrix.target }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            archive: tar.gz
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            archive: tar.gz
          # Both macOS targets on one arm runner: macos-13 (Intel) runners are
          # retiring and queue for hours; cross-compiling x86_64 from the arm
          # host is instant for a pure-Rust/rustls build.
          - os: macos-14
            target: aarch64-apple-darwin
            archive: tar.gz
          - os: macos-14
            target: x86_64-apple-darwin
            archive: tar.gz
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            archive: zip
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - name: Build
        run: cargo build --release --target ${{ matrix.target }}

      - name: Package (unix)
        if: matrix.archive == 'tar.gz'
        shell: bash
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          STAGING="moodle-mcp-${VERSION}-${{ matrix.target }}"
          mkdir -p "$STAGING"
          cp "target/${{ matrix.target }}/release/${BIN_NAME}" "$STAGING/"
          cp README.md LICENSE "$STAGING/"
          tar czf "${STAGING}.tar.gz" "$STAGING"
          echo "archive=${STAGING}.tar.gz" >> "$GITHUB_ENV"

      - name: Package (windows)
        if: matrix.archive == 'zip'
        shell: pwsh
        run: |
          $version = $env:GITHUB_REF_NAME -replace '^v', ''
          $staging = "moodle-mcp-$version-${{ matrix.target }}"
          New-Item -ItemType Directory -Force -Path $staging | Out-Null
          Copy-Item "target/${{ matrix.target }}/release/${{ env.BIN_NAME }}.exe" "$staging/"
          Copy-Item README.md, LICENSE $staging/
          Compress-Archive -Path $staging -DestinationPath "$staging.zip"
          "archive=$staging.zip" >> $env:GITHUB_ENV

      - name: Package (mcpb)
        # MCP bundle (mcpb): manifest + the raw binary, flat zip. Claude
        # Desktop/Claude Code install these with one click — no toolchain.
        shell: bash
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          EXT=""
          CMD="${BIN_NAME}"
          if [[ "${{ matrix.target }}" == *windows* ]]; then
            EXT=".exe"
            CMD="${BIN_NAME}.exe"
          fi
          DIR="mcpb-staging"
          rm -rf "$DIR" && mkdir "$DIR"
          cp "target/${{ matrix.target }}/release/${BIN_NAME}${EXT}" "${DIR}/${CMD}"
          cat > "${DIR}/manifest.json" <<EOF
          {
            "manifest_version": "0.3",
            "name": "moodle-mcp",
            "display_name": "moodle-mcp",
            "version": "${VERSION}",
            "description": "Moodle LMS for LLM agents — courses, assignments, forums, files, submissions.",
            "author": { "name": "G36maid" },
            "website": "https://moodle.ntnu.cc",
            "repository": "https://github.com/G36maid/moodle-mcp",
            "server": {
              "type": "binary",
              "command": "${CMD}",
              "env": {
                "MOODLE_URL": { "description": "Moodle site URL, e.g. https://moodle.example.com", "required": true },
                "MOODLE_TOKEN": { "description": "Web-service token from moodle-mcp auth", "required": true }
              }
            }
          }
          EOF
          if [[ "${{ matrix.os }}" == windows-* ]]; then
            (cd "$DIR" && 7z a "../moodle-mcp-${VERSION}-${{ matrix.target }}.mcpb" .)
          else
            (cd "$DIR" && zip -r "../moodle-mcp-${VERSION}-${{ matrix.target }}.mcpb" .)
          fi
          echo "mcpb=moodle-mcp-${VERSION}-${{ matrix.target }}.mcpb" >> "$GITHUB_ENV"

      - uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.target }}
          path: |
            ${{ env.archive }}
            ${{ env.mcpb }}

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      # Only to read CHANGELOG.md for the release notes below.
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v8
        with:
          merge-multiple: true
          path: dist

      # Notes come verbatim from the tagged version's CHANGELOG.md section so
      # the repo changelog and the GitHub release can never drift apart;
      # --generate-notes produced near-empty bodies for tagged releases.
      - name: Extract release notes from CHANGELOG.md
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          awk -v heading="## [$VERSION]" \
            'index($0, heading) == 1 { found = 1; next }
             found && /^## \[/ { exit }
             found { print }' CHANGELOG.md > RELEASE_NOTES.md
          grep -q '[^[:space:]]' RELEASE_NOTES.md || {
            echo "::error::CHANGELOG.md has no section for $VERSION"
            exit 1
          }

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ github.ref_name }}" \
            --repo "${{ github.repository }}" \
            --title "moodle-mcp ${{ github.ref_name }}" \
            --notes-file RELEASE_NOTES.md \
            dist/*

  # Publishes the crate via crates.io trusted publishing (OIDC): no long-lived
  # API token is stored in repo secrets. Requires a one-time config on
  # crates.io (crate Settings -> Trusted Publishing): owner G36maid, repo
  # moodle-mcp, workflow release.yml, no environment. The very first version
  # must be published manually; afterwards tags drive it. Versions that are
  # already on crates.io (e.g. that first manual publish) are skipped.
  publish:
    name: publish (crates.io)
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # OIDC token, exchanged for a short-lived publish token
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          key: publish

      - name: Check version matches tag
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          grep -qx "version = \"$VERSION\"" Cargo.toml || {
            echo "::error::Cargo.toml version is not $VERSION (tag ${{ github.ref_name }})"
            exit 1
          }

      - name: Skip if version already on crates.io
        id: published
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          if curl -fsS -A "moodle-mcp release job (https://github.com/G36maid/moodle-mcp)" \
               "https://crates.io/api/v1/crates/moodle-mcp/$VERSION" > /dev/null; then
            echo "already=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Authenticate with crates.io
        if: steps.published.outputs.already != 'true'
        uses: rust-lang/crates-io-auth-action@v1
        id: auth

      - name: Publish
        if: steps.published.outputs.already != 'true'
        run: cargo publish --locked
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
