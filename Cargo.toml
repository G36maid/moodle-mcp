[package]
name = "moodle-mcp"
version = "0.2.0"
edition = "2024"
rust-version = "1.88"
description = "Moodle MCP server in Rust — expose Moodle Web Services to MCP clients (student-first, stdio)"
license = "MIT"
repository = "https://github.com/G36maid/moodle-mcp"
readme = "README.md"
exclude = [".github/", "AGENTS.md", ".gitignore"]
keywords = ["mcp", "moodle", "llm", "modelcontextprotocol", "lms"]
categories = ["api-bindings", "command-line-utilities"]

[dependencies]
rmcp = { version = "3.5", features = ["server", "macros", "transport-io"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "io-std", "fs", "time"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
schemars = "1"
reqwest = { version = "0.13", features = ["json", "multipart", "form", "cookies"] }
anydoc = "0.2"
htmd = "0.5"
thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
chrono = { version = "0.4", default-features = false, features = ["clock", "std", "serde"] }
chrono-tz = "0.10"
url = "2"
base64 = "0.23"
regex = "1"
inquire = "0.9.4"

[dev-dependencies]
wiremock = "0.6"
rmcp = { version = "3.5", features = ["client"] }
tokio = { version = "1", features = ["io-util"] }

[profile.release]
lto = true
strip = true
