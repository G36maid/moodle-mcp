# cargo-audit policy. The three zip advisories below (RUSTSEC-2026-0367,
# -0368, -0369: suid/symlink escapes in ZipArchive::extract) are unreachable
# here: anydoc 0.2.4 — the only zip consumer — reads zip-based documents
# (docx/xlsx/pptx) entry-by-entry in memory and never extracts to the
# filesystem. anydoc still pins zip ^8; drop these ignores when it ships
# zip >= 9. Time-boxed: revisit by 2026-11-19.
[advisories]
ignore = [
    "RUSTSEC-2026-0367",
    "RUSTSEC-2026-0368",
    "RUSTSEC-2026-0369",
]
